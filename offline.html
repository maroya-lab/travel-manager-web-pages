<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <title>Travel Manager Pro · 오프라인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100dvh;padding:24px;color:#1b1d19;background:#f5f3ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}.card{max-width:330px;padding:30px;border:1px solid rgba(31,34,29,.1);border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(40,35,29,.12)}.mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 20px;border-radius:19px;color:white;background:#466559;font-size:26px}h1{margin:0 0 10px;font-size:24px;letter-spacing:-.04em}p{margin:0;color:#74776f;font-size:13px;line-height:1.7}button{margin-top:20px;padding:12px 18px;border:0;border-radius:13px;color:white;background:#1b1d19;font:inherit;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">⌖</div><h1>인터넷 연결을 확인해 주세요.</h1><p>한 번 실행한 여행 데이터는 오프라인에서도 사용할 수 있습니다. 첫 실행이라면 연결 후 다시 열어주세요.</p><button onclick="location.reload()">다시 시도</button></main></body>
</html>
