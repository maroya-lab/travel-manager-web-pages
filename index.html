    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>toast('오프라인 준비를 완료하지 못했습니다')));
    const baseRenderHome=renderHome;renderHome=()=>{baseRenderHome();q('.hero')?.style.setProperty('--trip-color',data.trip.color||'#e3ece7')};const baseRenderCollab=renderCollab;renderCollab=()=>{baseRenderCollab();qa('#page-collab .person').forEach((person,i)=>{const actions=document.createElement('span');actions.className='mini-actions';actions.innerHTML=`<button class="mini" data-edit="collaborators" data-index="${i}">✎</button><button class="mini" data-del="collaborators" data-index="${i}">×</button>`;person.appendChild(actions)})};const baseRenderOverview=renderOverview;renderOverview=()=>{baseRenderOverview();qa('#page-overview .filterbar .chip').forEach(button=>button.onclick=()=>{const selected=button.textContent.trim().split(' · ')[0],all=selected==='전체';qa('#page-overview .day-block').forEach(block=>{const day=block.querySelector('.day-title strong')?.textContent.trim();block.style.display=all||day===selected?'':'none'});qa('#page-overview .filterbar .chip').forEach(chip=>chip.classList.toggle('active',chip===button))});qa('#page-overview .event').forEach(event=>{const title=event.querySelector('strong')?.textContent.trim(),plan=data.plans.find(p=>p.title===title),expenses=plan?(data.scheduleExpenses||[]).filter(x=>x.planId===plan.id):[];if(plan&&expenses.length){const line=document.createElement('div');line.className='related';line.innerHTML=`<span class="tag">지출 ${expenses.length}건 · ${won(expenses.reduce((a,x)=>a+Number(x.actual||0),0))}</span><button class="link-btn" data-add="scheduleExpenses" data-plan-id="${plan.id}">+ 지출 추가</button>`;event.appendChild(line)}})};const baseRenderPlan=renderPlan;renderPlan=()=>{baseRenderPlan();qa('#page-plan .tree-plan').forEach((row,i)=>{const plan=data.plans[i],actions=row.querySelector('.mini-actions');if(plan&&actions){const button=document.createElement('button');button.className='mini';button.dataset.add='scheduleExpenses';button.dataset.planId=plan.id;button.textContent='₩';actions.prepend(button)}})};const baseOpenForm=openForm;openForm=(type,index=null,prefill={})=>{baseOpenForm(type,index);if(prefill.planId&&q('[name="planId"]'))q('[name="planId"]').value=prefill.planId};const baseBindDynamic=bindDynamic;bindDynamic=()=>{baseBindDynamic();qa('[data-add][data-plan-id]').forEach(button=>button.onclick=()=>openForm('scheduleExpenses',null,{planId:button.dataset.planId}))};
    const baseRenderPlanMoney=renderPlan;renderPlan=()=>{baseRenderPlanMoney();qa('#page-plan .tree-plan').forEach((row,i)=>{const plan=data.plans[i],copy=row.querySelector('.row-copy'),detail=copy?.querySelector('small');if(!plan||!copy||!detail)return;const expenses=(data.scheduleExpenses||[]).filter(x=>x.planId===plan.id),budget=expenses.length?expenses.reduce((a,x)=>a+Number(x.budget||0),0):Number(plan.budget||0),actual=expenses.length?expenses.reduce((a,x)=>a+Number(x.actual||0),0):Number(plan.actual||0);detail.textContent=plan.detail||'';const money=document.createElement('small');money.className='plan-money';money.textContent=`예산 ${won(budget)} · 지출 ${won(actual)}`;copy.appendChild(money)})};
    const baseRenderExpenseMeta=renderFeature;renderFeature=(type,...args)=>{baseRenderExpenseMeta(type,...args);if(type==='scheduleExpenses')qa('#page-scheduleExpenses .item-card').forEach((card,i)=>{const expense=data.scheduleExpenses[i],plan=data.plans.find(p=>p.id===expense?.planId);if(!expense)return;const meta=document.createElement('div');meta.className='expense-meta';meta.innerHTML=`<span>지출일자 ${esc(expense.expenseDate||'미정')}</span><span>사용 일정 ${esc(plan?`${plan.day} · ${plan.title}`:'미연결')}</span>`;card.appendChild(meta)})};
    const baseRenderOverviewDefault=renderOverview;renderOverview=()=>{baseRenderOverviewDefault();const chips=qa('#page-overview .filterbar .chip'),allChip=chips.find(x=>x.textContent.trim()==='전체');if(allChip){chips.forEach(x=>x.classList.toggle('active',x===allChip));qa('#page-overview .day-block').forEach(x=>x.style.display='')}};
    const baseRenderOverviewExpenses=renderOverview;renderOverview=()=>{baseRenderOverviewExpenses();qa('#page-overview .event').forEach(event=>{if(event.querySelector('[data-plan-id]'))return;const title=event.querySelector('strong')?.textContent.trim(),plan=data.plans.find(p=>p.title===title);if(!plan)return;const expenses=(data.scheduleExpenses||[]).filter(x=>x.planId===plan.id),line=document.createElement('div');line.className='related';line.innerHTML=`<span class="tag">지출 ${expenses.length}건 · ${won(expenses.reduce((a,x)=>a+Number(x.actual||0),0))}</span><button class="link-btn" data-add="scheduleExpenses" data-plan-id="${plan.id}">+ 지출 추가</button>`;event.appendChild(line)})};
    document.addEventListener('click',e=>{const panel=q('#searchPanel'),button=q('#searchBtn');if(panel&&panel.classList.contains('open')&&!panel.contains(e.target)&&!button.contains(e.target))panel.classList.remove('open')});
